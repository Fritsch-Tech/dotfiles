# Reference: https://github.com/i3/i3/blob/next/etc/config

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

after-startup-command = [
    # JankyBorders has a built-in detection of already running process,
    # so it won't be run twice on AeroSpace restart
    'exec-and-forget /opt/homebrew/opt/borders/bin/borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]      

start-at-login = true

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse window-lazy-center']

on-focus-changed = ['move-mouse window-lazy-center'] # Mouse lazily follows any focus (window or workspace)

[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/goodies#open-a-new-window-with-applescript
    alt-enter = '''exec-and-forget osascript -e '
      tell application "iTerm2"
        set newWindow to (create window with default profile)
      end tell'
    '''

    # i3 wraps focus by default
    alt-h =         'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace left'
    alt-j =         'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace down'
    alt-k =         'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace up'
    alt-l =         'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace right'

    alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
    alt-shift-j = 'move --boundaries all-monitors-outer-frame down'
    alt-shift-k = 'move --boundaries all-monitors-outer-frame up'
    alt-shift-l = 'move --boundaries all-monitors-outer-frame right'

    # Consider using 'join-with' command as a 'split' replacement if you want to enable
    # normalizations
    alt-n = 'split horizontal'
    alt-m = 'split vertical'

    alt-f = 'fullscreen'

    alt-q = 'layout v_accordion' # 'layout stacking' in i3
    alt-w = 'layout h_accordion' # 'layout tabbed' in i3
    alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

    alt-shift-f = 'layout floating tiling' # 'floating toggle' in i3

    # Not supported, because this command is redundant in AeroSpace mental model.
    # See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
    #alt-space = 'focus toggle_tiling_floating'

    # `focus parent`/`focus child` are not yet supported, and it's not clear whether they
    # should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
    # alt-a = 'focus parent'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'

    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
    alt-shift-0 = 'move-node-to-workspace 10 --focus-follows-window'

    alt-shift-r = 'reload-config'

    alt-r = 'mode resize'

    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

[workspace-to-monitor-force-assignment]
    1  = 'main'
    2  = 'main'
    3  = 'main'
    4  = 'main'
    5  = 'main'
    6  = 'built-in'
    7  = 'built-in'
    8  = 'built-in'
    9  = 'built-in'
    10 = 'built-in'

# Assign apps to workspaces
# https://nikitabobko.github.io/AeroSpace/goodies#popular-apps-ids

[[on-window-detected]]
    if.app-id = 'org.mozilla.firefox'
    run = 'move-node-to-workspace 1' 

[[on-window-detected]]
    if.app-id = 'com.jetbrains.webstorm'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.jetbrains.intellij'
    run = 'move-node-to-workspace 3'


[[on-window-detected]]
    if.app-id = 'com.googlecode.iterm2'
    run = 'move-node-to-workspace 4' 

